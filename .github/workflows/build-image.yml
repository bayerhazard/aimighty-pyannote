name: Build multi wrapper image (audio-pyannote)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: multi-v1)'
        required: false
        default: 'multi-v1'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/bayerhazard/audio-pyannote:${{ inputs.tag || 'multi-v1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "**ghcr.io/bayerhazard/audio-pyannote:${{ inputs.tag || 'multi-v1' }}**" >> "$GITHUB_STEP_SUMMARY"
